<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>쿠팡 판매자정보 캡처</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 13px;
    color: #222;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  button {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 8px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #captureBtn {
    background: #2563eb;
    color: #fff;
    font-weight: 600;
  }
  #captureBtn:hover { background: #1d4ed8; }
  .row-buttons {
    display: flex;
    gap: 8px;
  }
  .row-buttons button {
    flex: 1;
  }
  #downloadBtn {
    background: #16a34a;
    color: #fff;
  }
  #downloadBtn:hover { background: #15803d; }
  #clearBtn {
    background: #f3f4f6;
    color: #b91c1c;
    border: 1px solid #e5e7eb;
  }
  #clearBtn:hover { background: #fee2e2; }
  #status {
    min-height: 18px;
    margin: 4px 0 10px;
    font-size: 12px;
    color: #6b7280;
  }
  #status.error { color: #dc2626; }
  #status.ok { color: #16a34a; }
  .count {
    font-size: 12px;
    color: #374151;
    margin-bottom: 6px;
  }
  .count b { color: #111827; }
  #list {
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
  }
  .item {
    padding: 8px 10px;
    border-bottom: 1px solid #f0f0f0;
    position: relative;
  }
  .item:last-child { border-bottom: none; }
  .item .seller {
    font-weight: 600;
    margin-bottom: 2px;
  }
  .item .meta {
    color: #6b7280;
    font-size: 11px;
    line-height: 1.5;
  }
  .item .del {
    position: absolute;
    top: 6px;
    right: 8px;
    width: auto;
    padding: 2px 6px;
    margin: 0;
    background: transparent;
    color: #9ca3af;
    font-size: 12px;
  }
  .item .del:hover { color: #dc2626; }
  .empty {
    padding: 16px 10px;
    text-align: center;
    color: #9ca3af;
  }
  hr {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 12px 0;
  }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  .section-desc {
    font-size: 11px;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  #batchStartBtn {
    background: #7c3aed;
    color: #fff;
  }
  #batchStartBtn:hover { background: #6d28d9; }
  #batchStartBtn:disabled { background: #c4b5fd; cursor: not-allowed; }
  #batchStopBtn {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #e5e7eb;
  }
  #batchProgress {
    font-size: 12px;
    color: #4b5563;
    margin: 4px 0 8px;
    min-height: 16px;
  }
  #batchProgress b { color: #111827; }
  .blocked-warning { color: #b91c1c; }
  .progress-bar {
    height: 6px;
    background: #ede9fe;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
    display: none;
  }
  .progress-bar.active { display: block; }
  .progress-bar-fill {
    height: 100%;
    background: #7c3aed;
    width: 0%;
    transition: width 0.2s ease;
  }
  #keywordsInput {
    width: 100%;
    height: 70px;
    resize: vertical;
    font-family: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    margin-bottom: 6px;
    box-sizing: border-box;
  }
  .keyword-count-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 12px;
    color: #4b5563;
  }
  #perKeywordCount {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 12px;
  }
  #keywordStartBtn {
    background: #7c3aed;
    color: #fff;
  }
  #keywordStartBtn:hover { background: #6d28d9; }
  #keywordStartBtn:disabled { background: #c4b5fd; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>쿠팡 판매자정보 캡처</h1>
  <button id="captureBtn">이 페이지에서 판매자정보 캡처</button>
  <div id="status"></div>

  <hr />
  <div class="section-title">상품목록 자동 캡처</div>
  <div class="section-desc">쿠팡 검색/카테고리 목록 페이지에서 사용하세요. 화면에 보이는 상품을 순서대로 열어 판매자정보를 자동 캡처합니다. (최대 30개)</div>
  <button id="batchStartBtn">이 페이지 자동 캡처 시작</button>

  <hr />
  <div class="section-title">키워드로 자동 수집</div>
  <div class="section-desc">키워드를 한 줄에 하나씩 입력하면, 각 키워드로 쿠팡을 검색해 상위 상품들의 판매자정보를 순서대로 수집합니다. (최대 키워드 50개)</div>
  <textarea id="keywordsInput" placeholder="예)&#10;컴퓨터책상&#10;게이밍 의자&#10;무선 청소기"></textarea>
  <div class="keyword-count-row">
    <span>키워드당 수집 개수</span>
    <input type="number" id="perKeywordCount" min="1" max="30" value="30" />
  </div>
  <button id="keywordStartBtn">키워드 자동 수집 시작</button>

  <hr />
  <div class="row-buttons">
    <button id="batchStopBtn">중지</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="progress-bar-fill" id="progressBarFill"></div></div>
  <div id="batchProgress"></div>

  <hr />
  <div class="count">저장된 항목: <b id="countNum">0</b>건</div>
  <div class="row-buttons">
    <button id="downloadBtn">CSV 다운로드</button>
    <button id="clearBtn">전체 삭제</button>
  </div>
  <div id="list"></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
